# Публикация промо-сайта (папка site/) на GitHub Pages.
#
# Почему так: в корне репозитория лежит index.html (мокап интерфейса лаунчера),
# и если включить Pages для всего репозитория, он перекроет промо-сайт.
# Этот workflow деплоит ТОЛЬКО содержимое папки site/, поэтому главной страницей
# Pages становится наш промо-сайт, а корневой мокап остаётся доступен в репо.
#
# НАСТРОЙКА (один раз): Settings → Pages → Source → GitHub Actions.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
